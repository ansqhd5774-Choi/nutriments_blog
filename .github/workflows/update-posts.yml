name: Validate and update Nutriments Tistory posts
on:
  push:
    branches: [main]
    paths:
      - 'updates/**'
      - 'publishing/update.mjs'
      - 'publishing/update-core.mjs'
      - 'publishing/update-ledger.mjs'
      - 'publishing/validate-update.mjs'
      - 'publishing/core.mjs'
      - 'publishing/editorial.mjs'
      - 'publishing/nutrition-guard.mjs'
      - 'publishing/local-browser.mjs'
      - 'publishing/runtime-common.mjs'
      - 'tests/common.test.mjs'
      - 'tests/update.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/update-posts.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nutriments-validation-update
  cancel-in-progress: false
jobs:
  validate-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run validate:update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  update:
    concurrency:
      group: nutriments-tistory-mutation
      cancel-in-progress: false
    needs: validate-update
    if: vars.NUTRIMENTS_TISTORY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, nutriments-publisher]
    defaults:
      run:
        shell: cmd
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: pnpm run validate:update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm run update
        env:
          UPDATE_ENABLED: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
